<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2354487A%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Georgia,serif%27 font-weight=%27700%27 font-size=%2715%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EMA%3C/text%3E%3C/svg%3E">
<title>AI Agent Demo — Misbah Azib</title>
<meta name="description" content="Interactive demo of a Misbah Azib AI agent demo. Simulated data — Demo Mode.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#75639E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Existing MusfirahLoom design system (read-only, not modified) -->
<link rel="stylesheet" href="style.css">
<!-- AI Agent platform styles -->
<link rel="stylesheet" href="agents/css/agents-theme.css">
<link rel="stylesheet" href="agents/css/agents-core.css">
<link rel="stylesheet" href="agents/css/agent-chat.css">
<style>
  .site-skip{position:absolute;left:8px;top:-48px;z-index:200;padding:.6rem 1rem;
    border-radius:0 0 10px 10px;background:var(--ink);color:#fff;font-weight:600;
    font-size:.8rem;transition:top .18s ease;}
  .site-skip:focus{top:0;}
  main[tabindex="-1"]:focus{outline:none;}

  /* business context strip — shown when ?biz= is set */
  .ml-biz-context{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
    padding:.7rem 1rem;margin-bottom:1rem;border:1px solid var(--panel-line);
    border-left:3px solid var(--biz-accent,var(--wine));border-radius:8px;
    background:var(--panel);font-size:.82rem;}
  .ml-biz-context strong{font-family:var(--font-display);}
  .ml-biz-context .ml-biz-context__sep{color:var(--ink-dim);}
  .ml-biz-context .ml-biz-context__purpose{color:var(--ink-soft);flex-basis:100%;font-size:.8rem;line-height:1.5;}
  .ml-biz-context a{color:var(--wine);font-weight:600;text-decoration:underline;text-underline-offset:3px;}

  /* embed mode — chat sits inside an <iframe> panel on the demo site */
  body.is-embed{background:var(--panel);}
  body.is-embed .ml-topbar,
  body.is-embed .site-skip{display:none;}
  body.is-embed .ml-agent-shell{padding:1rem;max-width:none;min-height:100vh;}
  body.is-embed .ml-agent-header__back{display:none;}
  body.is-embed .ml-agent-header{margin-bottom:1rem;}
</style>
</head>
<body>

<a href="#main" class="site-skip">Skip to content</a>

<header class="ml-topbar">
  <a href="index.html" class="ml-wordmark">Misbah Azib<span>.</span></a>
  <span class="ml-topbar__spacer"></span>
  <a href="ai-agents.html" class="ml-topbar__link">AI Agents</a>
  <a href="ai-sales-funnel.html" class="ml-topbar__link">AI Funnel</a>
  <a href="campaigns.html" class="ml-topbar__link">Campaigns</a>
  <a href="agents.html" class="ml-topbar__link">&larr; All demos</a>
  <span class="ml-badge">Demo Mode</span>
</header>

<main class="ml-agent-shell" id="main" tabindex="-1">
  <div id="agentHeader"></div>
  <div id="agentChat" class="ml-chat-mount">
    <noscript>
      This interactive demo needs JavaScript enabled.
      <a href="agents.html">Back to the AI Agents overview</a>.
    </noscript>
  </div>
</main>

<script type="module" src="agents/js/agent.entry.js"></script>
</body>
</html>
